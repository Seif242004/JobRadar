spring:
  application:
    name: jobradar-api
  datasource:
    # Defaults match docker-compose.yml; production values come from env vars / Secrets Manager.
    url: ${JOBRADAR_DB_URL:jdbc:postgresql://localhost:5432/jobradar}
    username: ${JOBRADAR_DB_USER:jobradar}
    password: ${JOBRADAR_DB_PASSWORD:jobradar}
  flyway:
    enabled: true
  task:
    scheduling:
      pool:
        # The hot and backlog queue polls must never wait on each other or on the alert jobs.
        size: 4

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health

jobradar:
  ai:
    # OpenAI-compatible endpoint (SPEC.md D1 to D3). An empty key disables rerank and embeddings.
    base-url: ${JOBRADAR_AI_BASE_URL:https://integrate.api.nvidia.com/v1}
    key: ${JOBRADAR_AI_KEY:}
    model: ${JOBRADAR_AI_MODEL:openai/gpt-oss-20b}
    embedding-model: ${JOBRADAR_AI_EMBEDDING_MODEL:baai/bge-m3}
    daily-call-cap: ${JOBRADAR_AI_DAILY_CALL_CAP:200}
  aws:
    region: ${AWS_REGION:eu-central-1}
    # Set only for LocalStack (http://localhost:4566); empty means the real AWS endpoints.
    endpoint: ${JOBRADAR_AWS_ENDPOINT:}
  matching:
    listener:
      enabled: ${JOBRADAR_QUEUE_LISTENER_ENABLED:true}
    queues:
      hot-url: ${JOBRADAR_SQS_HOT_URL:http://sqs.eu-central-1.localhost.localstack.cloud:4566/000000000000/jobradar-hot}
      backlog-url: ${JOBRADAR_SQS_BACKLOG_URL:http://sqs.eu-central-1.localhost.localstack.cloud:4566/000000000000/jobradar-backlog}
  telegram:
    # Bot token from @BotFather; empty disables sending (alerts are logged instead).
    bot-token: ${JOBRADAR_TELEGRAM_BOT_TOKEN:}
  profile:
    # Optional path to a profile seed file (see seed/profile.example.json). Imported on startup;
    # safe to re-run. Empty means no import.
    seed-file: ${JOBRADAR_PROFILE_SEED_FILE:}
