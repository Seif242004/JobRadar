spring:
  application:
    name: jobradar-ingestion-worker
  datasource:
    # Defaults match docker-compose.yml; production values come from env vars / Secrets Manager.
    url: ${JOBRADAR_DB_URL:jdbc:postgresql://localhost:5432/jobradar}
    username: ${JOBRADAR_DB_USER:jobradar}
    password: ${JOBRADAR_DB_PASSWORD:jobradar}

jobradar:
  aws:
    region: ${AWS_REGION:eu-central-1}
    # Set only for LocalStack (http://localhost:4566); empty means the real AWS endpoints.
    endpoint: ${JOBRADAR_AWS_ENDPOINT:}
  ingestion:
    scheduling:
      # Runs the connectors and the careers resolver in this process (SPEC.md D6: ATS sources
      # every 15 min; Remotive at most 4 calls a day). Set to false to run no source at all.
      enabled: ${JOBRADAR_SCHEDULING_ENABLED:true}
    gmail:
      # The one Gmail label whose messages are read (a Gmail filter applies it to Wuzzuf, Bayt and
      # LinkedIn alert emails). Same OAuth client as the apply flow.
      enabled: ${JOBRADAR_GMAIL_ALERTS_ENABLED:true}
      label: ${JOBRADAR_GMAIL_ALERT_LABEL:JobRadar}
      client-id: ${JOBRADAR_GOOGLE_CLIENT_ID:}
      client-secret: ${JOBRADAR_GOOGLE_CLIENT_SECRET:}
    himalayas:
      # Free API key from himalayas.app/signup/developer; empty means the source does nothing.
      api-key: ${JOBRADAR_HIMALAYAS_API_KEY:}
    workable:
      # One search request per location and run.
      locations: ${JOBRADAR_WORKABLE_LOCATIONS:Egypt}
    queues:
      hot-url: ${JOBRADAR_SQS_HOT_URL:http://sqs.eu-central-1.localhost.localstack.cloud:4566/000000000000/jobradar-hot}
      backlog-url: ${JOBRADAR_SQS_BACKLOG_URL:http://sqs.eu-central-1.localhost.localstack.cloud:4566/000000000000/jobradar-backlog}

server:
  port: ${PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health
